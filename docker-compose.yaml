services:

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=12345678
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - imdb_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark-master:
    build: 
      context: .
      dockerfile: Dockerfile
    image: custom-spark:3.3.0
    container_name: spark-master
    environment:
      - INIT_DAEMON_STEP=setup_spark
    ports:
      - "7077:7077"
      - "8080:8080"
    networks:
      - imdb_net

  spark-client:
    image: custom-spark:3.3.0  # Dùng lại image đã build ở trên
    container_name: spark-client
    stdin_open: true
    tty: true
    depends_on:
      - spark-master
      - minio
    environment:
      - SPARK_MASTER=spark://spark-master:7077
    ports:
      - "4040:4040"
    volumes:
      - ./etl:/etl
      - ./data:/data
    networks:
      - imdb_net

  spark-worker-1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
    volumes:
      - ./data:/data
    networks:
      - imdb_net

  spark-worker-2:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
    volumes:
      - ./data:/data
    networks:
      - imdb_net

  backend:
    image: python:3.11-slim
    container_name: bigdata-backend
    working_dir: /workspace
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - PYTHONPATH=/workspace/agent
    ports:
      - "8000:8000"
    volumes:
      - ./:/workspace
    command: >
      sh -c "pip install --no-cache-dir -r agent/requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - imdb_net

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: bigdata-agent:latest
    container_name: bigdata-agent
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - API_KEY=${API_KEY:-}
      - BACKEND_URL=http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
      - minio
      - spark-master
    restart: unless-stopped
    volumes:
      - ./agent:/app
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501
    networks:
      - imdb_net

networks:
  imdb_net:
    driver: bridge

volumes:
  minio_data:
