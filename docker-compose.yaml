services:
  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: spark-master
    environment:
      - INIT_DAEMON_STEP=setup_spark
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./jars/hadoop-aws-3.3.2.jar:/spark/jars/hadoop-aws-3.3.2.jar
      - ./jars/aws-java-sdk-bundle-1.11.1026.jar:/spark/jars/aws-java-sdk-bundle-1.11.1026.jar

  spark-client:
    image: bde2020/spark-base:3.3.0-hadoop3.3
    container_name: spark-client
    stdin_open: true
    tty: true
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
    ports:
      - "4040:4040"
    volumes:
      - ./jars/hadoop-aws-3.3.2.jar:/spark/jars/hadoop-aws-3.3.2.jar
      - ./jars/aws-java-sdk-bundle-1.11.1026.jar:/spark/jars/aws-java-sdk-bundle-1.11.1026.jar
  
  spark-worker-1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1g
      - SPARK_WORKER_CORES=2
    volumes:
      - ./jars/hadoop-aws-3.3.2.jar:/spark/jars/hadoop-aws-3.3.2.jar
      - ./jars/aws-java-sdk-bundle-1.11.1026.jar:/spark/jars/aws-java-sdk-bundle-1.11.1026.jar

  spark-worker-2:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1g
      - SPARK_WORKER_CORES=2
    volumes:
      - ./jars/hadoop-aws-3.3.2.jar:/spark/jars/hadoop-aws-3.3.2.jar
      - ./jars/aws-java-sdk-bundle-1.11.1026.jar:/spark/jars/aws-java-sdk-bundle-1.11.1026.jar
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=12345678
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data
   


  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: bigdata-agent:latest
    container_name: bigdata-agent
    environment:
      - PYTHONUNBUFFERED=1
      # Cấu hình kết nối mạng nội bộ Docker tới Spark và MinIO
      - SPARK_MASTER_URL=spark://spark-master:7077
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=12345678
      # Đừng quên điền API Key nếu bạn sử dụng mô hình LLM
      - API_KEY=${API_KEY}
      - PYSPARK_SUBMIT_ARGS=--jars /spark/jars/hadoop-aws-3.3.2.jar,/spark/jars/aws-java-sdk-bundle-1.11.1026.jar pyspark-shell
    ports:
      - "8501:8501"
    depends_on:
      - minio
      - spark-master
    restart: unless-stopped
    volumes:
      - ./agent:/app
      - ./data:/data
      - ./jars/hadoop-aws-3.3.2.jar:/spark/jars/hadoop-aws-3.3.2.jar
      - ./jars/aws-java-sdk-bundle-1.11.1026.jar:/spark/jars/aws-java-sdk-bundle-1.11.1026.jar
volumes:
  minio-data:
  
