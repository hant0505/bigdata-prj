services:

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=12345678
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - imdb_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: spark-master
    environment:
      - INIT_DAEMON_STEP=setup_spark
    ports:
      - "7077:7077"
      - "8080:8080"
    networks:
      - imdb_net

  spark-client:
    image: bde2020/spark-base:3.3.0-hadoop3.3
    container_name: spark-client
    stdin_open: true
    tty: true
    depends_on:
      - spark-master
      - minio
    environment:
      - SPARK_MASTER=spark://spark-master:7077
    ports:
      - "4040:4040"
    volumes:
      - ./etl:/etl
      - ./IMBD_ijs:/data
    networks:
      - imdb_net

  spark-worker-1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
    volumes:
      - ./IMBD_ijs:/data
    networks:
      - imdb_net

  spark-worker-2:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
    volumes:
      - ./IMBD_ijs:/data
    networks:
      - imdb_net

networks:
  imdb_net:
    driver: bridge

volumes:
  minio_data: